[package]
name = "lite-brightness"
version = "0.1.0"
edition = "2021"
description = "Tiny Twinkle Tray alternative for Windows: laptop + external monitor brightness (DDC/CI, WMI) from the tray, with keyboard volume-dial support (Ant Esports MK800)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/JatinShimpi/lite-brightness"
keywords = ["brightness", "monitor", "ddc-ci", "twinkletray", "twinkle-tray"]
categories = ["os::windows-apis", "hardware-support", "gui"]

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Devices_Display",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Rpc",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
